# @file mods.toml
# @spec TOML v0.5.0 (https://github.com/toml-lang/toml)
#
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_description}" 
credits="NoCredits"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="immersiveengineering"
    mandatory=true
    versionRange="[${ie_version},)"
    ordering="AFTER"
    side="BOTH"	
  
